name: CI
on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this exact gate before building anything it publishes.
  workflow_call:
permissions:
  contents: read
concurrency:
  # github.workflow is the caller's name under workflow_call, so releases never cancel CI.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  ui:
    name: UI checks, unit and e2e tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui typecheck
      - run: pnpm --dir ui lint
      - run: pnpm --dir ui test
      - run: pnpm --dir ui exec playwright install --with-deps chromium
      # test:e2e builds the production bundle first, so this also produces ui/dist.
      - run: pnpm --dir ui test:e2e
      - run: test -f ui/dist/index.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust (${{ matrix.os }})
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        # Explicit images: ubuntu x86_64, macOS arm64, Windows x86_64.
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: ui/dist
      # Installs the toolchain and components pinned in rust-toolchain.toml (preinstalled rustup).
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Smoke test the release binary
        shell: bash
        run: bash .github/scripts/smoke-binary.sh "target/release/switchyard$([ "$RUNNER_OS" = Windows ] && echo .exe)"

  docker:
    name: Container build and smoke test (compose.yaml)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: switchyard-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose build --pull
      - name: Run the published compose setup; check UI, auth, permissions, persistence, shutdown
        run: |
          trap 'docker compose logs || true; docker compose down --volumes || true' EXIT
          docker compose up -d
          wait_healthy() {
            for _ in $(seq 1 60); do
              curl --silent --fail http://127.0.0.1:7410/healthz > /dev/null && return 0
              sleep 1
            done
            return 1
          }
          wait_healthy
          data=/home/switchyard/.local/share/switchyard
          test "$(docker compose exec -T switchyard id -u)" = 10001
          test "$(docker compose exec -T switchyard stat -c '%a %u' "$data")" = "700 10001"
          test "$(docker compose exec -T switchyard switchyard token-path)" = "$data/admin-token"
          token=$(docker compose exec -T switchyard cat "$data/admin-token")
          bash .github/scripts/check-gateway.sh http://127.0.0.1:7410 "$token" remote
          # State survives a restart.
          docker compose restart switchyard
          wait_healthy
          test "$(docker compose exec -T switchyard cat "$data/admin-token")" = "$token"
          # SIGTERM drains and exits cleanly.
          docker compose stop switchyard
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq switchyard)")" = 0

  scripts:
    name: Workflow and script lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck .github/scripts/*.sh
